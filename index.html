<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meteo Visual Demo</title>
<style>
  html, body { margin: 0; padding: 0; background: #05070a; overflow: hidden; height: 100%; }
  canvas { display: block; }
  video { display: none; }

  #hud {
    position: fixed; top: 10px; left: 10px; z-index: 10;
    font-family: monospace; font-size: 12px; color: #ddd8;
    background: #0008; padding: 8px 10px; border-radius: 6px;
    line-height: 1.5; pointer-events: none; user-select: none;
  }
  #hud b { color: #fff; }

  #panel {
    position: fixed; top: 10px; right: 10px; z-index: 10;
    font-family: sans-serif; font-size: 12px; color: #eee;
    background: #000a; padding: 10px 12px; border-radius: 8px;
    min-width: 190px; user-select: none;
  }
  #panel h4 { margin: 0 0 6px; font-size: 11px; font-weight: 600; color: #aaa; text-transform: uppercase; letter-spacing: .04em; }
  #panel label { display: flex; align-items: center; gap: 6px; margin: 4px 0; cursor: pointer; }
  #panel input[type=checkbox] { accent-color: #ffb046; }
  #panel .src-btns { display: flex; gap: 6px; margin-top: 8px; }
  #panel button {
    flex: 1; font-size: 11px; padding: 5px 6px; border-radius: 5px;
    border: 1px solid #555; background: #1a1a1a; color: #eee; cursor: pointer;
  }
  #panel button:hover { background: #262626; }
  #panel button.active { border-color: #ffb046; color: #ffb046; }
  #fileInput, #imgInput { display: none; }
  #manualParams { max-height: 220px; overflow-y: auto; }
  .mp-row { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
  .mp-row span { flex: 1; font-size: 11px; color: #ccc; }
  .mp-row input[type=number] {
    width: 62px; font-size: 11px; padding: 3px 4px; border-radius: 4px;
    border: 1px solid #555; background: #111; color: #eee;
  }
  .mp-row input[type=checkbox] { accent-color: #4aa3ff; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<video id="video" autoplay muted playsinline loop></video>
<input type="file" id="fileInput" accept="video/*">
<div id="hud"></div>

<div id="panel">
  <h4>Layers</h4>
  <label><input type="checkbox" data-layer="dots" checked> pressure dots</label>
  <label><input type="checkbox" data-layer="ripples" checked> wind ripples</label>
  <label><input type="checkbox" data-layer="arrows" checked> wind arrows</label>
  <label><input type="checkbox" data-layer="particles" checked> camera particles</label>
  <label><input type="checkbox" data-layer="dither" checked> RGB dither</label>
  <label><input type="checkbox" data-layer="uv" checked> UV glass</label>
  <label><input type="checkbox" data-layer="grain" checked> dust/rain grain</label>
  <h4 style="margin-top:10px;">Image / video source</h4>
  <div class="src-btns">
    <button id="btnCam">camera</button>
    <button id="btnFile">video</button>
    <button id="btnImg">photo</button>
    <button id="btnNone" class="active">none</button>
  </div>

  <h4 style="margin-top:10px;">Manual values</h4>
  <div id="manualParams"></div>
</div>
<input type="file" id="imgInput" accept="image/*">

<script>
/* ============================================================
   METEO VISUAL DEMO
   ------------------------------------------------------------
   Visi meteo duomenys (cloudCover, seaLevelPressure, windSpeed,
   windDirection, airTemperature) yra SIMULIUOJAMI random/drift
   funkcijoje `simulateData()`. Vėliau pakeisk ją realiu fetch()
   į savo sensorių serverį / LHMT-FMI API — visa kito kodo dalis
   naudoja tik `state` objektą, tad pakeitimas bus lokalizuotas.

   Vaizdo šaltinis (kamera arba uploadintas video) naudojamas:
   - dalelėms spawninti/spalvinti (particles layer)
   - RGB dither sluoksniui (dominuojantis kanalas R/G/B iš vaizdo)
   Jei vaizdo šaltinio nėra, abu sluoksniai veikia su simuliuotom
   RGB reikšmėm (state.rgb), kad demo veiktų ir be kameros.
   ============================================================ */

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize);
resize();

/* ------------------------------------------------------------
   LAYER TOGGLES
------------------------------------------------------------- */
const layers = { dots: true, ripples: true, arrows: true, particles: true, dither: true, uv: true, grain: true };
document.querySelectorAll('#panel input[type=checkbox]').forEach(cb => {
  cb.addEventListener('change', () => { layers[cb.dataset.layer] = cb.checked; });
});

/* ------------------------------------------------------------
   STATE — meteo parametrai, TARGET + smooth VALUE
------------------------------------------------------------- */
const state = {
  cloudCover:      { value: 40,  target: 40,  min: 0,   max: 100 },
  seaLevelPressure:{ value: 1013,target: 1013,min: 985, max: 1040},
  windSpeed:       { value: 3,   target: 3,   min: 0,   max: 20  },
  windDirection:   { value: 0,   target: 0,   min: 0,   max: 360 },
  airTemperature:  { value: 12,  target: 12,  min: -15, max: 35  },
  uvIndex:         { value: 3,   target: 3,   min: 0,   max: 11  },
  dust:            { value: 20,  target: 20,  min: 0,   max: 100 },
  rain:            { value: 0,   target: 0,   min: 0,   max: 100 },
  rgb: { r: 130, g: 140, b: 150 }
};

const SIM_UPDATE_MS = 6000;
function randBetween(a, b) { return a + Math.random() * (b - a); }
const manualParams = new Set();

function simulateData() {
  // TODO: čia vėliau vietoj random darysi fetch() į savo API
  // ir priskirsi state.<param>.target = realiOsReiksme
  for (const key of ['cloudCover','seaLevelPressure','windSpeed','windDirection','airTemperature','uvIndex','dust','rain']) {
    if (manualParams.has(key)) continue; // rankiniu būdu įvesta reikšmė — nepersirašom
    const p = state[key];
    const range = p.max - p.min;
    const step = range * randBetween(-0.18, 0.18);
    p.target = Math.max(p.min, Math.min(p.max, p.value + step));
  }
  state.rgb = { r: randBetween(60,255), g: randBetween(60,255), b: randBetween(60,255) };
}
simulateData();
setInterval(simulateData, SIM_UPDATE_MS);

function updateState(dt) {
  for (const key of ['cloudCover','seaLevelPressure','windSpeed','windDirection','airTemperature','uvIndex','dust','rain']) {
    const p = state[key];
    p.value += (p.target - p.value) * Math.min(1, dt * 0.6);
  }
}

/* ------------------------------------------------------------
   RANKINIS PARAMETRŲ ĮVEDIMAS
   Kai naudotojas pažymi "manual" checkbox ir įveda skaičių,
   ta reikšmė tampa fiksuotu target/value ir simuliacija jos
   nebekeičia, kol checkbox neatžymėtas.
------------------------------------------------------------- */
const paramLabels = {
  cloudCover: 'cloudCover (%)',
  seaLevelPressure: 'pressure (hPa)',
  windSpeed: 'windSpeed (m/s)',
  windDirection: 'windDir (°)',
  airTemperature: 'airTemp (°C)',
  uvIndex: 'uvIndex',
  dust: 'dust (%)',
  rain: 'rain (%)'
};
const manualParamsEl = document.getElementById('manualParams');
for (const key of Object.keys(paramLabels)) {
  const p = state[key];
  const row = document.createElement('div');
  row.className = 'mp-row';
  row.innerHTML = `
    <input type="checkbox" data-manual="${key}">
    <span>${paramLabels[key]}</span>
    <input type="number" data-value="${key}" min="${p.min}" max="${p.max}" step="0.1" value="${p.value.toFixed(1)}" disabled>
  `;
  manualParamsEl.appendChild(row);
}
manualParamsEl.addEventListener('change', (e) => {
  const key = e.target.dataset.manual || e.target.dataset.value;
  if (!key) return;
  const numInput = manualParamsEl.querySelector(`input[data-value="${key}"]`);
  const checkbox = manualParamsEl.querySelector(`input[data-manual="${key}"]`);
  if (e.target.dataset.manual !== undefined && e.target.type === 'checkbox') {
    if (checkbox.checked) { manualParams.add(key); numInput.disabled = false; }
    else { manualParams.delete(key); numInput.disabled = true; }
  }
  if (e.target.dataset.value && manualParams.has(key)) {
    const p = state[key];
    const v = Math.max(p.min, Math.min(p.max, parseFloat(numInput.value)));
    p.target = v;
    p.value = v; // iškart, be laipsniško drift'o
  }
});

/* ------------------------------------------------------------
   SPALVŲ PALETĖ pagal airTemperature
------------------------------------------------------------- */
function tempColor(temp, alpha) {
  const t = (temp - state.airTemperature.min) / (state.airTemperature.max - state.airTemperature.min);
  const cold = { r: 70, g: 68, b: 66 };
  const warm = { r: 255, g: 176, b: 70 };
  const r = cold.r + (warm.r - cold.r) * t;
  const g = cold.g + (warm.g - cold.g) * t;
  const b = cold.b + (warm.b - cold.b) * t;
  return `rgba(${r|0}, ${g|0}, ${b|0}, ${alpha})`;
}

/* ------------------------------------------------------------
   VIDEO / CAMERA ŠALTINIS
------------------------------------------------------------- */
const video = document.getElementById('video');
const fileInput = document.getElementById('fileInput');
const imgInput = document.getElementById('imgInput');
const btnCam = document.getElementById('btnCam');
const btnFile = document.getElementById('btnFile');
const btnImg = document.getElementById('btnImg');
const btnNone = document.getElementById('btnNone');

// sample grid resolution — this doubles as the halftone/dither grid resolution
const SAMPLE_W = 90, SAMPLE_H = 60;
const sampleCanvas = document.createElement('canvas');
const sampleCtx = sampleCanvas.getContext('2d', { willReadFrequently: true });
sampleCanvas.width = SAMPLE_W;
sampleCanvas.height = SAMPLE_H;

let sourceMode = 'none'; // 'none' | 'video' | 'image'
let sourcePixels = null; // Uint8ClampedArray, SAMPLE_W x SAMPLE_H
let staticImage = null;

function setActiveBtn(btn) {
  [btnCam, btnFile, btnImg, btnNone].forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function stopVideoStream() {
  if (video.srcObject) { video.srcObject.getTracks().forEach(t => t.stop()); video.srcObject = null; }
  video.removeAttribute('src');
}

btnCam.addEventListener('click', async () => {
  try {
    staticImage = null;
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    video.srcObject = stream;
    await video.play();
    sourceMode = 'video';
    setActiveBtn(btnCam);
  } catch (e) {
    console.error('camera error', e);
    sourceMode = 'none';
  }
});

btnFile.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => {
  const f = fileInput.files[0];
  if (!f) return;
  staticImage = null;
  const url = URL.createObjectURL(f);
  video.srcObject = null;
  video.src = url;
  video.play();
  sourceMode = 'video';
  setActiveBtn(btnFile);
});

btnImg.addEventListener('click', () => imgInput.click());
imgInput.addEventListener('change', () => {
  const f = imgInput.files[0];
  if (!f) return;
  stopVideoStream();
  const url = URL.createObjectURL(f);
  const img = new Image();
  img.onload = () => {
    staticImage = img;
    sourceMode = 'image';
    setActiveBtn(btnImg);
  };
  img.src = url;
});

btnNone.addEventListener('click', () => {
  sourceMode = 'none';
  sourcePixels = null;
  staticImage = null;
  stopVideoStream();
  setActiveBtn(btnNone);
});

// draws the current source (video or photo), covering the sample grid,
// preserving aspect ratio (crop-to-fill, like CSS object-fit: cover)
function drawSourceToSample(el, elW, elH) {
  const srcRatio = elW / elH, dstRatio = SAMPLE_W / SAMPLE_H;
  let sx, sy, sw, sh;
  if (srcRatio > dstRatio) { sh = elH; sw = elH * dstRatio; sx = (elW - sw) / 2; sy = 0; }
  else { sw = elW; sh = elW / dstRatio; sx = 0; sy = (elH - sh) / 2; }
  sampleCtx.drawImage(el, sx, sy, sw, sh, 0, 0, SAMPLE_W, SAMPLE_H);
}

function sampleSourceFrame() {
  try {
    if (sourceMode === 'video' && video.readyState >= 2) {
      drawSourceToSample(video, video.videoWidth, video.videoHeight);
    } else if (sourceMode === 'image' && staticImage) {
      drawSourceToSample(staticImage, staticImage.naturalWidth, staticImage.naturalHeight);
    } else return;
    const frame = sampleCtx.getImageData(0, 0, SAMPLE_W, SAMPLE_H);
    sourcePixels = frame.data;
    let r = 0, g = 0, b = 0, n = SAMPLE_W * SAMPLE_H;
    for (let i = 0; i < sourcePixels.length; i += 4) { r += sourcePixels[i]; g += sourcePixels[i+1]; b += sourcePixels[i+2]; }
    state.rgb = { r: r/n, g: g/n, b: b/n };
  } catch (e) { /* source not ready yet */ }
}
setInterval(sampleSourceFrame, 150);

// cellAt: nx, ny in 0..1 -> {r,g,b,lum} at that grid cell of the source
function cellAt(nx, ny) {
  if (sourcePixels) {
    const px = Math.min(SAMPLE_W - 1, Math.max(0, (nx * SAMPLE_W) | 0));
    const py = Math.min(SAMPLE_H - 1, Math.max(0, (ny * SAMPLE_H) | 0));
    const idx = (py * SAMPLE_W + px) * 4;
    const r = sourcePixels[idx], g = sourcePixels[idx+1], b = sourcePixels[idx+2];
    return { r, g, b, lum: (0.299*r + 0.587*g + 0.114*b) / 255 };
  }
  const rgb = state.rgb;
  return { r: rgb.r, g: rgb.g, b: rgb.b, lum: (0.299*rgb.r + 0.587*rgb.g + 0.114*rgb.b) / 255 };
}
function pixelAt(nx, ny) { return cellAt(nx, ny); }

/* ------------------------------------------------------------
   TAŠKŲ TINKLAS / HALFTONE — seaLevelPressure + šaltinio vaizdas
   Kai nėra šaltinio: paprastas tolygus taškų tinklas, dydis/tarpai
   valdomi pressure (kaip anksčiau).
   Kai yra šaltinis (kamera/video/nuotrauka): kiekvienas taškas
   atitinka vieną vaizdo gardelės langelį — jo dydį lemia TIEK
   pressure (bendras tankis/mastelis), TIEK to langelio šviesumas
   (tamsesnė vieta vaizde = didesnis taškas, kaip spausdinimo
   dot-matrix/pusatoniai efektas).
------------------------------------------------------------- */
function drawPressureDots(time) {
  const p = state.seaLevelPressure;
  const norm = (p.value - p.min) / (p.max - p.min);

  if (sourcePixels) {
    // halftone iš šaltinio vaizdo
    const cols = 70, rows = Math.round(cols * (H / W));
    const cellW = W / cols, cellH = H / rows;
    const maxR = (Math.min(cellW, cellH) / 2) * (0.55 + norm * 0.65); // pressure -> bendras taškų mastelis
    for (let cy = 0; cy < rows; cy++) {
      for (let cx = 0; cx < cols; cx++) {
        const nx = cx / cols, ny = cy / rows;
        const cell = cellAt(nx, ny);
        const darkness = 1 - cell.lum; // tamsesnė vieta -> didesnis taškas
        const r = Math.max(0.4, darkness * maxR);
        const x = (cx + 0.5) * cellW, y = (cy + 0.5) * cellH;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fillStyle = tempColor(state.airTemperature.value, 0.55);
        ctx.fill();
      }
    }
    return;
  }

  // fallback: tolygus taškų tinklas be šaltinio
  const spacing = 55 - norm * 30;
  const dotSize = 2.4 - norm * 1.4;
  for (let x = spacing / 2; x < W; x += spacing) {
    for (let y = spacing / 2; y < H; y += spacing) {
      const wobble = Math.sin(time * 0.4 + x * 0.01 + y * 0.01) * 1.2;
      ctx.beginPath();
      ctx.arc(x + wobble, y + wobble, Math.max(0.6, dotSize), 0, Math.PI * 2);
      ctx.fillStyle = tempColor(state.airTemperature.value, 0.35);
      ctx.fill();
    }
  }
}

/* ------------------------------------------------------------
   VĖJO SPALVA — fiksuota tamsiai mėlyna, kad nesusilietų su
   temperatūros gelsvai-oranžine palete ir liktų matoma
------------------------------------------------------------- */
function windColor(alpha) {
  return `rgba(40, 70, 140, ${alpha})`;
}
const ripples = [];
setInterval(() => {
  ripples.push({ x: randBetween(W*0.2, W*0.8), y: randBetween(H*0.2, H*0.8), born: performance.now() });
}, 1400);

function drawRipples() {
  const wind = state.windSpeed.value;
  const dirRad = state.windDirection.value * Math.PI / 180;
  const stretchX = Math.cos(dirRad) * (wind / state.windSpeed.max) * 0.5;
  const stretchY = Math.sin(dirRad) * (wind / state.windSpeed.max) * 0.5;
  const lineWidth = 0.6 + (wind / state.windSpeed.max) * 2.2;
  const gapChance = 0.15 + (wind / state.windSpeed.max) * 0.55;

  for (let i = ripples.length - 1; i >= 0; i--) {
    const rp = ripples[i];
    const age = (performance.now() - rp.born) / 1000;
    const radius = 6 + age * 40;
    if (radius > Math.max(W, H) * 0.6) { ripples.splice(i, 1); continue; }
    const alpha = Math.max(0, 0.5 - age * 0.05);
    ctx.save();
    ctx.translate(rp.x, rp.y);
    ctx.scale(1 + stretchX, 1 + stretchY);
    ctx.strokeStyle = windColor(alpha);
    ctx.lineWidth = lineWidth;
    const segments = 90;
    ctx.beginPath();
    for (let s = 0; s <= segments; s++) {
      if (Math.random() < gapChance * 0.02) continue;
      const a = (s / segments) * Math.PI * 2;
      const px = Math.cos(a) * radius, py = Math.sin(a) * radius;
      ctx.moveTo(px, py);
      ctx.lineTo(px + Math.cos(a) * 1.5, py + Math.sin(a) * 1.5);
    }
    ctx.stroke();
    ctx.restore();
  }
}

/* ------------------------------------------------------------
   VĖJO RODYKLĖS — baltos pagal nutylėjimą; kai yra vaizdo
   šaltinis (kamera/video/nuotrauka), kiekviena rodyklė gimdama
   pasiima to taško spalvą iš vaizdo (sujungta su color particles
   idėja) ir tą spalvą neša palei save
------------------------------------------------------------- */
let arrows = [];
const MAX_ARROWS = 140;
function edgeSpawnPoint(dirDeg) {
  const rad = dirDeg * Math.PI / 180;
  const dx = Math.cos(rad), dy = Math.sin(rad);
  const startX = W / 2 - dx * W, startY = H / 2 - dy * H;
  return {
    x: startX + randBetween(-W*0.4, W*0.4) * Math.abs(dy),
    y: startY + randBetween(-H*0.4, H*0.4) * Math.abs(dx),
    vx: dx, vy: dy
  };
}
function spawnArrow() {
  if (arrows.length >= MAX_ARROWS) return;
  const sp = edgeSpawnPoint(state.windDirection.value);
  const nx = Math.random(), ny = Math.random();
  const col = sourcePixels ? cellAt(nx, ny) : null;
  arrows.push({ x: sp.x, y: sp.y, vx: sp.vx, vy: sp.vy, life: 1, speedMul: randBetween(0.6, 1.2), col });
}
function drawArrows(dt) {
  const p = state.seaLevelPressure;
  const norm = (p.value - p.min) / (p.max - p.min);
  const baseSpeed = 20 + state.windSpeed.value * 18;
  for (let i = arrows.length - 1; i >= 0; i--) {
    const a = arrows[i];
    a.x += a.vx * baseSpeed * dt; a.y += a.vy * baseSpeed * dt;
    a.speedMul *= 0.985; a.life -= dt * 0.06;
    if (a.life <= 0 || a.x < -50 || a.x > W+50 || a.y < -50 || a.y > H+50) { arrows.splice(i,1); continue; }
    const angle = Math.atan2(a.vy, a.vx);
    const len = 12 + norm * 4;
    ctx.save();
    ctx.translate(a.x, a.y); ctx.rotate(angle);
    ctx.strokeStyle = a.col
      ? `rgba(${Math.min(255,a.col.r+80)|0},${Math.min(255,a.col.g+80)|0},${Math.min(255,a.col.b+80)|0},${a.life*0.85})`
      : `rgba(255,255,255,${a.life * 0.8})`;
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(-len/2, 0); ctx.lineTo(len/2, 0);
    ctx.lineTo(len/2-4, -3); ctx.moveTo(len/2, 0); ctx.lineTo(len/2-4, 3);
    ctx.stroke();
    ctx.restore();
  }
  const spawnChance = 0.05 + (state.windSpeed.value / state.windSpeed.max) * 0.9;
  if (Math.random() < spawnChance) spawnArrow();
}

/* ------------------------------------------------------------
   CAMERA / VIDEO PARTICLES
------------------------------------------------------------- */
let camParticles = [];
const MAX_CAM_PARTICLES = 220;
function spawnCamParticle() {
  if (camParticles.length >= MAX_CAM_PARTICLES) return;
  const nx = Math.random(), ny = Math.random();
  const col = pixelAt(nx, ny);
  camParticles.push({ x: nx * W, y: ny * H, r: randBetween(1, 3.2), col, life: 1 });
}
function drawCamParticles(dt) {
  const dirRad = state.windDirection.value * Math.PI / 180;
  const speed = 6 + state.windSpeed.value * 6;
  for (let i = camParticles.length - 1; i >= 0; i--) {
    const p = camParticles[i];
    p.x += Math.cos(dirRad) * speed * dt;
    p.y += Math.sin(dirRad) * speed * dt;
    p.life -= dt * 0.05;
    if (p.life <= 0 || p.x < -10 || p.x > W+10 || p.y < -10 || p.y > H+10) { camParticles.splice(i,1); continue; }
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fillStyle = `rgba(${p.col.r|0},${p.col.g|0},${p.col.b|0},${p.life*0.85})`;
    ctx.fill();
  }
  for (let n = 0; n < 3; n++) if (Math.random() < 0.6) spawnCamParticle();
}

/* ------------------------------------------------------------
   RGB DITHER SLUOKSNIS — nutildyta (toned down) spalvota dither,
   naudojanti PAČIO vaizdo (kameros/video/nuotraukos) spalvas
   kiekvienoje gardelės vietoje, o ne vieną dominuojantį kanalą.
   Kai nėra šaltinio, naudoja simuliuotą state.rgb kaip fallback.
------------------------------------------------------------- */
function drawDither() {
  const cols = 90, rows = Math.round(cols * (H / W));
  const cellW = W / cols, cellH = H / rows;
  ctx.save();
  for (let cy = 0; cy < rows; cy++) {
    for (let cx = 0; cx < cols; cx++) {
      if (Math.random() > 0.5) continue; // dither retina — ne kiekvienoje gardelėje taškas
      const nx = cx / cols, ny = cy / rows;
      const cell = cellAt(nx, ny);
      // "toned down": maišom su pilka, kad spalva nedominuotų per stipriai
      const mix = 0.55;
      const r = cell.r * mix + 140 * (1 - mix);
      const g = cell.g * mix + 140 * (1 - mix);
      const b = cell.b * mix + 140 * (1 - mix);
      const x = cx * cellW + randBetween(0, cellW), y = cy * cellH + randBetween(0, cellH);
      ctx.fillStyle = `rgba(${r|0},${g|0},${b|0},${randBetween(0.2,0.55)})`;
      ctx.fillRect(x, y, 1.6, 1.6);
    }
  }
  ctx.restore();
}

/* ------------------------------------------------------------
   UV GLASS / DICHROIC SHIMMER
------------------------------------------------------------- */
let uvPhase = 0;
function drawUVGlass(dt) {
  uvPhase += dt * (0.2 + state.uvIndex.value * 0.05);
  const uvNorm = state.uvIndex.value / state.uvIndex.max;
  const hueA = 200 + uvNorm * 160;
  const hueB = hueA + 60;
  ctx.save();
  ctx.globalAlpha = 0.12 + uvNorm * 0.18;
  ctx.globalCompositeOperation = 'lighter';
  const bandCount = 6;
  for (let i = 0; i < bandCount; i++) {
    const offset = (i / bandCount) * W * 2 + Math.sin(uvPhase + i) * 120;
    const grad = ctx.createLinearGradient(offset - 300, 0, offset + 300, H);
    grad.addColorStop(0, `hsla(${hueA},80%,65%,0)`);
    grad.addColorStop(0.5, `hsla(${(hueA+hueB)/2},85%,70%,1)`);
    grad.addColorStop(1, `hsla(${hueB},80%,65%,0)`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  }
  ctx.restore();
}

/* ------------------------------------------------------------
   DUST / RAIN GRAIN
------------------------------------------------------------- */
function drawGrain() {
  const amount = Math.max(state.dust.value, state.rain.value) / 100;
  if (amount <= 0.02) return;
  const density = amount * 0.06;
  ctx.save();
  for (let i = 0; i < W * H * density / 400; i++) {
    const x = Math.random() * W, y = Math.random() * H;
    const shade = Math.random() < 0.5 ? 255 : 0;
    ctx.fillStyle = `rgba(${shade},${shade},${shade},${randBetween(0.03,0.12)})`;
    ctx.fillRect(x, y, 1, 1);
  }
  ctx.fillStyle = `rgba(5,7,10,${amount * 0.15})`;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

/* (bloom sluoksnis pašalintas — balino visą vaizdą) */

/* ------------------------------------------------------------
   HUD
------------------------------------------------------------- */
const hud = document.getElementById('hud');
function updateHUD() {
  hud.innerHTML =
    `<b>cloudCover</b>: ${state.cloudCover.value.toFixed(0)}%<br>` +
    `<b>seaLevelPressure</b>: ${state.seaLevelPressure.value.toFixed(0)} hPa<br>` +
    `<b>windSpeed</b>: ${state.windSpeed.value.toFixed(1)} m/s<br>` +
    `<b>windDirection</b>: ${state.windDirection.value.toFixed(0)}°<br>` +
    `<b>airTemperature</b>: ${state.airTemperature.value.toFixed(1)} °C<br>` +
    `<b>uvIndex</b>: ${state.uvIndex.value.toFixed(1)}<br>` +
    `<b>dust</b>: ${state.dust.value.toFixed(0)}% <b>rain</b>: ${state.rain.value.toFixed(0)}%<br>` +
    `<b>source</b>: ${sourceMode === 'none' ? 'none (simulated RGB)' : sourceMode}`;
}

/* ------------------------------------------------------------
   MAIN LOOP
------------------------------------------------------------- */
let lastTime = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;

  updateState(dt);

  ctx.fillStyle = 'rgba(5,7,10,0.18)';
  ctx.fillRect(0, 0, W, H);

  if (layers.dots) drawPressureDots(now / 1000);
  if (layers.ripples) drawRipples();
  if (layers.arrows) drawArrows(dt);
  if (layers.particles) drawCamParticles(dt);
  if (layers.dither) drawDither();
  if (layers.uv) drawUVGlass(dt);
  if (layers.grain) drawGrain();

  updateHUD();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
